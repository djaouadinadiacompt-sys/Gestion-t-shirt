<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock — T-shirts</title>
<style>
  :root{
    --ink:#1c1c1c;
    --paper:#faf9f6;
    --accent:#2f5d50;
    --accent-soft:#e6efec;
    --line:#d8d5cc;
    --danger:#a13d3d;
    --warn:#a3782c;
    --warn-soft:#f5ecd8;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding:0 0 60px;
  }
  header{background:var(--accent);color:#fff;padding:22px 20px 18px;text-align:center;}
  header h1{margin:0;font-size:1.25rem;font-weight:600;}
  header p{margin:4px 0 0;font-size:.8rem;opacity:.85;}
  header nav{margin-top:10px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  header a{color:#fff;font-size:.78rem;text-decoration:underline;opacity:.9;}
  main{max-width:640px;margin:0 auto;padding:16px;}

  .stats{display:flex;gap:10px;margin-bottom:14px;}
  .stat-box{flex:1;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;}
  .stat-box .n{font-size:1.2rem;font-weight:700;color:var(--accent);}
  .stat-box .l{font-size:.68rem;color:#888;text-transform:uppercase;letter-spacing:.04em;}

  .filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .filters input, .filters select{
    flex:1;min-width:130px;padding:9px 10px;border:1px solid var(--line);
    border-radius:8px;font-size:.88rem;background:#fff;
  }

  .produit-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .produit-card.alerte{border-color:var(--warn);background:var(--warn-soft);}
  .produit-card.rupture{border-color:var(--danger);background:#fbeaea;}

  .produit-info b{display:block;font-size:.95rem;font-weight:700;}
  .produit-info span{font-size:.78rem;color:#888;}
  .produit-ref{font-size:.68rem;color:#bbb;font-family:monospace;}

  .produit-right{text-align:right;}
  .produit-stock{font-size:1.3rem;font-weight:700;color:var(--accent);}
  .produit-card.alerte .produit-stock{color:var(--warn);}
  .produit-card.rupture .produit-stock{color:var(--danger);}
  .produit-prix{font-size:.75rem;color:#888;margin-top:2px;}
  .badge-inactif{
    display:inline-block;margin-top:4px;font-size:.68rem;font-weight:700;
    color:#888;background:#eee;padding:2px 6px;border-radius:5px;
  }

  .loading, .empty{text-align:center;padding:40px 20px;color:#888;font-size:.9rem;}
</style>
</head>
<body>

<header>
  <h1>Stock actuel</h1>
  <p>Vue d'ensemble des quantités</p>
  <nav>
    <a href="index.html">Menu</a>
    <a href="achat.html">Achat de stock</a>
    <a href="commande.html">Nouvelle commande</a>
    <a href="suivi.html">Suivi</a>
  </nav>
</header>

<main>

  <div class="stats" id="statsBox"></div>

  <div class="filters">
    <input type="text" id="searchInput" placeholder="Rechercher un modèle…">
    <select id="filtreAlerte">
      <option value="">Tous les produits</option>
      <option value="alerte">Stock bas / rupture seulement</option>
    </select>
  </div>

  <div id="loadingState" class="loading">Chargement du stock…</div>
  <div id="listeProduits"></div>
  <div id="emptyState" class="empty" style="display:none;">Aucun produit trouvé.</div>

</main>

<script>
  // ⚠️ Même URL que dans les autres pages (finit par /exec)
  const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxiU1AxtIVfclYHPp-DxYn0ZRhwg_w8-CuDVZUht4SweBGDbz2b2E4yJ2xwS3Kj5dc8EQ/exec";

  let produits = [];

  async function chargerStock() {
    try {
      const res = await fetch(WEBAPP_URL + "?action=produits_tous");
      produits = await res.json();
      document.getElementById("loadingState").style.display = "none";
      afficherStats();
      afficherListe();
    } catch (err) {
      document.getElementById("loadingState").style.display = "block";
      document.getElementById("loadingState").textContent = "Erreur de chargement : " + err.message;
    }
  }

  function afficherStats() {
    const box = document.getElementById("statsBox");
    const total = produits.length;
    const enAlerte = produits.filter(p => Number(p.stock) <= Number(p.seuil || 0)).length;
    const totalUnites = produits.reduce((s, p) => s + (Number(p.stock) || 0), 0);

    box.innerHTML = `
      <div class="stat-box"><div class="n">${total}</div><div class="l">Références</div></div>
      <div class="stat-box"><div class="n">${totalUnites}</div><div class="l">Unités en stock</div></div>
      <div class="stat-box"><div class="n">${enAlerte}</div><div class="l">En alerte</div></div>
    `;
  }

  function afficherListe() {
    const search = document.getElementById("searchInput").value.toLowerCase();
    const filtreAlerte = document.getElementById("filtreAlerte").value;

    const filtres = produits.filter(p => {
      const matchSearch = !search || String(p.modele || "").toLowerCase().includes(search) || String(p.ref || "").toLowerCase().includes(search);
      const enAlerte = Number(p.stock) <= Number(p.seuil || 0);
      const matchAlerte = !filtreAlerte || enAlerte;
      return matchSearch && matchAlerte;
    });

    const container = document.getElementById("listeProduits");
    const emptyState = document.getElementById("emptyState");

    if (filtres.length === 0) {
      container.innerHTML = "";
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";

    container.innerHTML = filtres.map(p => {
      const stock = Number(p.stock) || 0;
      const seuil = Number(p.seuil) || 0;
      let classeAlerte = "";
      if (stock <= 0) classeAlerte = "rupture";
      else if (stock <= seuil) classeAlerte = "alerte";

      return `
        <div class="produit-card ${classeAlerte}">
          <div class="produit-info">
            <b>${escapeHtml(p.modele)}</b>
            <span>${escapeHtml(p.typeCol || "")} · ${escapeHtml(p.taille)} · ${escapeHtml(p.couleur)}</span>
            <div class="produit-ref">${escapeHtml(p.ref)}</div>
            ${p.statut !== "Actif" ? '<span class="badge-inactif">Inactif</span>' : ""}
          </div>
          <div class="produit-right">
            <div class="produit-stock">${stock}</div>
            <div class="produit-prix">Achat: ${Number(p.prixAchat || 0).toLocaleString('fr-FR')} DA · Vente: ${Number(p.prixVente || 0).toLocaleString('fr-FR')} DA</div>
          </div>
        </div>
      `;
    }).join("");
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  document.getElementById("searchInput").addEventListener("input", afficherListe);
  document.getElementById("filtreAlerte").addEventListener("change", afficherListe);

  chargerStock();
</script>

</body>
</html>
