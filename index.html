<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion T-shirts</title>
<style>
  :root{
    --ink:#1c1c1c;
    --paper:#faf9f6;
    --accent:#2f5d50;
    --accent-soft:#e6efec;
    --line:#d8d5cc;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    background:var(--accent);
    color:#fff;
    padding:32px 20px 26px;
    text-align:center;
  }
  header h1{margin:0;font-size:1.4rem;letter-spacing:.02em;font-weight:700;}
  header p{margin:6px 0 0;font-size:.85rem;opacity:.85;}

  main{
    flex:1;
    max-width:480px;
    width:100%;
    margin:0 auto;
    padding:28px 16px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  a.menu-card{
    display:flex;
    align-items:center;
    gap:16px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 18px;
    text-decoration:none;
    color:var(--ink);
    transition:border-color .15s, transform .1s;
  }
  a.menu-card:active{transform:scale(0.98);}
  a.menu-card:hover{border-color:var(--accent);}

  .menu-icon{
    width:48px;
    height:48px;
    border-radius:10px;
    background:var(--accent-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.4rem;
    flex-shrink:0;
  }
  .menu-text b{display:block;font-size:1.02rem;font-weight:700;margin-bottom:2px;}
  .menu-text span{font-size:.8rem;color:#888;}

  footer{
    text-align:center;
    padding:16px;
    font-size:.72rem;
    color:#aaa;
  }
</style>
</head>
<body>

<header>
  <h1>Gestion T-shirts</h1>
  <p>Choisissez une action</p>
</header>

<main>

  <a class="menu-card" href="stock.html">
    <div class="menu-icon">📊</div>
    <div class="menu-text">
      <b>Stock</b>
      <span>Voir les quantités actuelles de chaque produit</span>
    </div>
  </a>

  <a class="menu-card" href="achat.html">
    <div class="menu-icon">📦</div>
    <div class="menu-text">
      <b>Achat de stock</b>
      <span>Réapprovisionner ou créer un nouveau produit</span>
    </div>
  </a>

  <a class="menu-card" href="commande.html">
    <div class="menu-icon">🛒</div>
    <div class="menu-text">
      <b>Nouvelle commande</b>
      <span>Saisir une commande client</span>
    </div>
  </a>

  <a class="menu-card" href="suivi.html">
    <div class="menu-icon">📋</div>
    <div class="menu-text">
      <b>Suivi de commande</b>
      <span>Voir et gérer les commandes en cours</span>
    </div>
  </a>

</main>

<footer>Gestion interne — t-shirts</footer>

</body>
</html>
