<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi des commandes</title>
<style>
  :root{
    --ink:#1c1c1c;
    --paper:#faf9f6;
    --accent:#2f5d50;
    --accent-soft:#e6efec;
    --line:#d8d5cc;
    --danger:#a13d3d;
    --warn:#a3782c;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding:0 0 60px;
  }
  header{background:var(--accent);color:#fff;padding:22px 20px 18px;text-align:center;}
  header h1{margin:0;font-size:1.25rem;font-weight:600;}
  header p{margin:4px 0 0;font-size:.8rem;opacity:.85;}
  header a{color:#fff;font-size:.78rem;text-decoration:underline;opacity:.9;}
  main{max-width:640px;margin:0 auto;padding:16px;}
  .filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .filters input, .filters select{
    flex:1;min-width:130px;padding:9px 10px;border:1px solid var(--line);
    border-radius:8px;font-size:.88rem;background:#fff;
  }
  .stats{display:flex;gap:10px;margin-bottom:14px;}
  .stat-box{flex:1;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;}
  .stat-box .n{font-size:1.2rem;font-weight:700;color:var(--accent);}
  .stat-box .l{font-size:.68rem;color:#888;text-transform:uppercase;letter-spacing:.04em;}

  .commande-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:10px;
  }
  .commande-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
  .commande-client{font-weight:700;font-size:.95rem;}
  .commande-meta{font-size:.72rem;color:#999;margin-top:2px;}
  .commande-num{font-size:.68rem;color:#bbb;font-family:monospace;margin-top:1px;}
  .commande-total{font-weight:700;color:var(--accent);font-size:.95rem;white-space:nowrap;}

  .articles-list{
    background:var(--paper);
    border-radius:8px;
    padding:8px 10px;
    margin:8px 0;
  }
  .article-row{
    display:flex;
    justify-content:space-between;
    font-size:.82rem;
    padding:4px 0;
    color:#444;
  }
  .article-row:not(:last-child){border-bottom:1px dashed var(--line);}
  .article-row .qte{color:#888;font-size:.76rem;}

  .commande-comment{font-size:.8rem;color:#666;margin-bottom:8px;}
  .commande-bottom{display:flex;gap:8px;align-items:center;justify-content:space-between;}
  select.statut-select{
    padding:7px 8px;border-radius:6px;border:1px solid var(--line);
    font-size:.8rem;font-weight:600;flex:1;
  }
  .contact-btn{
    padding:7px 10px;background:var(--accent-soft);color:var(--accent);
    border-radius:6px;text-decoration:none;font-size:.78rem;font-weight:600;white-space:nowrap;
  }
  .loading, .empty{text-align:center;padding:40px 20px;color:#888;font-size:.9rem;}
</style>
</head>
<body>

<header>
  <h1>Suivi des commandes</h1>
  <p>Vue d'ensemble</p>
  <a href="commande.html">← Nouvelle commande</a>
</header>

<main>

  <div class="stats" id="statsBox"></div>

  <div class="filters">
    <input type="text" id="searchInput" placeholder="Rechercher un client…">
    <select id="statutFilter">
      <option value="">Tous les statuts</option>
      <option value="En attente">En attente</option>
      <option value="Préparée">Préparée</option>
      <option value="Expédiée">Expédiée</option>
      <option value="Livrée">Livrée</option>
      <option value="Retournée">Retournée</option>
      <option value="Annulée">Annulée</option>
    </select>
  </div>

  <div id="loadingState" class="loading">Chargement des commandes…</div>
  <div id="listeCommandes"></div>
  <div id="emptyState" class="empty" style="display:none;">Aucune commande trouvée.</div>

</main>

<script>
  // ⚠️ Même URL que dans commande.html (finit par /exec)
  const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyxLaB-9d8QwNvl0STtVUJGsPupqN0vr8gbDmBygFYlCTehjDZl34Qf97hIVBos3AsQbw/exec";

  let commandes = [];

  async function chargerCommandes() {
    try {
      const res = await fetch(WEBAPP_URL + "?action=commandes");
      commandes = await res.json();
      document.getElementById("loadingState").style.display = "none";
      afficherStats();
      afficherListe();
    } catch (err) {
      document.getElementById("loadingState").textContent =
        "Erreur de chargement. Vérifie l'URL Apps Script (WEBAPP_URL) dans le code.";
    }
  }

  function afficherStats() {
    const box = document.getElementById("statsBox");
    const total = commandes.length;
    const enAttente = commandes.filter(c => c.statut === "En attente").length;
    const ca = commandes
      .filter(c => c.statut !== "Annulée" && c.statut !== "Retournée")
      .reduce((s, c) => s + (Number(c.total) || 0), 0);

    box.innerHTML = `
      <div class="stat-box"><div class="n">${total}</div><div class="l">Commandes</div></div>
      <div class="stat-box"><div class="n">${enAttente}</div><div class="l">En attente</div></div>
      <div class="stat-box"><div class="n">${ca.toLocaleString('fr-FR')}</div><div class="l">DA (CA)</div></div>
    `;
  }

  function afficherListe() {
    const search = document.getElementById("searchInput").value.toLowerCase();
    const statutFiltre = document.getElementById("statutFilter").value;

    const filtrees = commandes.filter(c => {
      const matchSearch = !search || (c.client || "").toLowerCase().includes(search);
      const matchStatut = !statutFiltre || c.statut === statutFiltre;
      return matchSearch && matchStatut;
    });

    const container = document.getElementById("listeCommandes");
    const emptyState = document.getElementById("emptyState");

    if (filtrees.length === 0) {
      container.innerHTML = "";
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";

    container.innerHTML = filtrees.map(c => {
      const dateStr = c.date ? new Date(c.date).toLocaleDateString('fr-FR', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : "";
      const telClean = (c.telephone || "").replace(/\s|\./g, "");
      const statutClass = (c.statut || "").replace(/\s/g, "_");
      const lieuStr = [c.adresse, c.wilaya].filter(Boolean).join(", ");

      const articlesHtml = (c.articles || []).map(a => `
        <div class="article-row">
          <span>${escapeHtml(a.modele)} — ${escapeHtml(a.taille)} · ${escapeHtml(a.couleur)} <span class="qte">× ${a.quantite}</span></span>
          <span>${Number(a.total).toLocaleString('fr-FR')} DA</span>
        </div>
      `).join("");

      return `
        <div class="commande-card">
          <div class="commande-top">
            <div>
              <div class="commande-client">${escapeHtml(c.client)}</div>
              <div class="commande-meta">${dateStr}${lieuStr ? " — " + escapeHtml(lieuStr) : ""}</div>
              <div class="commande-num">${escapeHtml(c.numCommande)}</div>
            </div>
            <div class="commande-total">${Number(c.total).toLocaleString('fr-FR')} DA</div>
          </div>
          <div class="articles-list">${articlesHtml}</div>
          ${c.commentaire ? `<div class="commande-comment">💬 ${escapeHtml(c.commentaire)}</div>` : ""}
          <div class="commande-bottom">
            <select class="statut-select ${statutClass}" data-num="${escapeHtml(c.numCommande)}" onchange="majStatut(this)">
              <option ${c.statut === "En attente" ? "selected" : ""}>En attente</option>
              <option ${c.statut === "Préparée" ? "selected" : ""}>Préparée</option>
              <option ${c.statut === "Expédiée" ? "selected" : ""}>Expédiée</option>
              <option ${c.statut === "Livrée" ? "selected" : ""}>Livrée</option>
              <option ${c.statut === "Retournée" ? "selected" : ""}>Retournée</option>
              <option ${c.statut === "Annulée" ? "selected" : ""}>Annulée</option>
            </select>
            ${telClean ? `<a class="contact-btn" href="tel:${telClean}">📞 Appeler</a>` : ''}
          </div>
        </div>
      `;
    }).join("");
  }

  async function majStatut(selectEl) {
    const numCommande = selectEl.dataset.num;
    const nouveauStatut = selectEl.value;
    selectEl.disabled = true;

    try {
      const res = await fetch(WEBAPP_URL, {
        method: "POST",
        body: JSON.stringify({ type: "maj_statut", numCommande: numCommande, statut: nouveauStatut })
      });
      const result = await res.json();
      if (!result.success) {
        alert("Erreur : " + result.message);
      } else {
        const c = commandes.find(x => x.numCommande === numCommande);
        if (c) c.statut = nouveauStatut;
        afficherStats();
      }
    } catch (err) {
      alert("Erreur réseau : " + err.message);
    } finally {
      selectEl.disabled = false;
    }
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  document.getElementById("searchInput").addEventListener("input", afficherListe);
  document.getElementById("statutFilter").addEventListener("change", afficherListe);

  chargerCommandes();
</script>

</body>
</html>
